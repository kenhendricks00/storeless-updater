name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write       # create the GitHub Release
  id-token: write       # OIDC for Sigstore signing
  attestations: write   # publish the build-provenance attestation

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --locked --release

      - name: Stage artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/storeless-updater.exe dist/storeless-updater.exe
          $hash = (Get-FileHash dist/storeless-updater.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  storeless-updater.exe" | Out-File -FilePath dist/storeless-updater.exe.sha256 -Encoding ASCII -NoNewline

          # v0.1.0 was published as BinaryFerry. Keep one migration asset so
          # that its self-updater can install v0.2.0 and move users to the new name.
          Copy-Item dist/storeless-updater.exe dist/binaryferry.exe
          "$hash  binaryferry.exe" | Out-File -FilePath dist/binaryferry.exe.sha256 -Encoding ASCII -NoNewline
          Write-Host "SHA-256: $hash"

      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/storeless-updater.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body_path: RELEASE_NOTES.md
          files: |
            dist/storeless-updater.exe
            dist/storeless-updater.exe.sha256
            dist/binaryferry.exe
            dist/binaryferry.exe.sha256
